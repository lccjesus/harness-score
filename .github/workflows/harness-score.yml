name: Harness Score

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harness-score:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Enforce harness maturity
        uses: paladini/harness-score@v1
        with:
          min-level: "4"
          badge: ""
